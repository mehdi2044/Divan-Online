round:#f6e2c4;color:#4c3028;border:1px solid #cba47b}.meta{text-align:center;color:#b89e8e;font-size:13px}.foot{text-align:center;margin:16px;color:#d8bb9c}.note{font-size:14px;color:#856c56!important}a{color:#ffcd84}@media(max-width:650px){.toc{grid-template-columns:1fr}.sheet{min-height:65vh}.sheet p{line-height:2.15}.book{min-height:65vh}} .story-illustration{margin:15px 0 20px;border:2px solid #c28c59;border-radius:16px;overflow:hidden;background:#2d1e21;box-shadow:0 10px 25px #0004}.story-illustration img{margin:0;width:100%;max-height:390px;object-fit:cover;border-radius:0}.story-illustration figcaption{padding:8px 12px;background:#fff0d8;color:#6b422b;font-size:13px} </style></head><body><header><h1>دیوان دیوانه‌وار</h1><p>دریا شو، رود خودش می‌آید · روایت مرد کلبه و بانوی آتش</p></header><main><div style="text-align:center;margin:8px auto 12px"><a href="https://canva.link/4q48fc9i2a4knyr" target="_blank" rel="noopener" style="display:inline-block;border:1px solid #d69d62;border-radius:12px;padding:10px 20px;background:#6b372a;text-decoration:none;color:#ffe1b1">🎨 گالری تصاویر سینمایی دیوان</a></div><nav class="toolbar"><button onclick="go(0)">جلد</button><button onclick="go(1)">فهرست</button><button onclick="move(-1)">❯ پیشین</button><button onclick="move(1)">بعدی ❮</button><button onclick="font(-1)">الف −</button><button onclick="font(1)">الف +</button></nav><section class="book"><article class="sheet" id="sheet"></article></section><div class="foot"><span id="status"></span><p class="meta">نسخه روایی بازپرداخت‌شده · متن HTML و تصویرسازی مستقل · بدون صفحات PDF</p></div></main><script>const chapters=[{"t":"دود در میان برف؛ زنی در بندِ خانه","p":["باد، برف را به پهلوی کلبه می‌کوبید و درختان زیر بار سپیدی خم شده بودند. مرد هیزم‌شکن، با پالتویی که بوی چوب خیس می‌داد، پشت در ایستاد. از شکاف پنجره نور زردی بیرون می‌ریخت؛ نورِ خانه‌ای که هیچ‌کس در روستا نامش را نشنیده بود. پیش از آنکه دستش به حلقه در برسد، صدای زنی از آن سوی چوب بلند شد: «اگر گرسنه‌ای، وارد شو؛ اما پیش از خوردن، حرفی هست که باید بشنوی.»","زمستان بر شانه‌های جنگل نشسته بود و مردی که سالیان دراز با هیزم و کتاب روزگار می‌گذراند، در راه بازگشت رشته‌ای دود دید. آن سوی درختان، کلبه‌ای بود که دیروز نبود. مرد تبر را بر زمین گذاشت و به پنجره‌های روشن خیره شد. از دود، گرما را حدس زد؛ اما از گرما، صاحب خانه را نه.","زن در را گشود؛ گیسوان روشن، جامه‌ای به رنگ شرابِ انار و نگاهی که هم دعوت بود و هم هشدار. گفت: «در این خانه، آتش خاموش نمی‌شود؛ ولی هر روشنایی، نشانه رهایی نیست.» مرد پاسخ داد: «آتش اگر خانه را گرم کند، نعمت است؛ اگر خانه را زندان کند، چه؟»","زن گفت که سال‌هاست به طلسمی بسته شده است. یخچال کلبه هر بامداد پر می‌شود، بی‌آنکه کسی از بیرون چیزی بیاورد. شرطِ جادو این است که او خود غذا بپزد؛ و هر که از دست‌پختش بخورد، به سرنوشت این خانه گرفتار شود. زن می‌تواند در را بگشاید، اما از آستانه دور نمی‌شود.","زن از پشت در، مرد را زیر نظر داشت. او می‌توانست مانند هر رهگذر دیگری نان را بردارد، بخورد و بی‌خبر از بهای آن در خانه بماند؛ اما پرسشِ مرد درباره آزادی، چیزی در ذهن زن گشود که سال‌ها زیر تکرارِ روزها مدفون مانده بود. در این کلبه، جادو غذا می‌آفرید؛ ولی هیچ جادویی نمی‌توانست رضایتِ آگاهانه بیافریند.","مرد کلبه گفت: «من نه از نون می‌ترسم، نه از موندن. از این می‌ترسم که آدم، بی‌خبر از بهای یک انتخاب، اسمش رو خوشبختی بذاره.» بانوی آتش پاسخ داد: «پس بمان تا از گذشته‌ام بگویم؛ نه به حکم طلسم، فقط تا وقتی خودت بخواهی.»","مرد گرسنه بود. بوی نان تازه، از آشپزخانه تا درگاه می‌رسید. بااین‌همه دست به سفره نبرد. گفت: «اگر لقمه‌ای قرار است آزادی مرا بگیرد، باید پیش از خوردن، بهایش را بدانم. نیاز، حقیقت دارد؛ اما فریب را نباید با مهمان‌نوازی آراست.» زن برای نخستین بار لبخندی بی‌هراس زد.","آن شب مرد هیزمی بر آتش نهاد و کنار شومینه نشست. نه خود را ناجی زن خواند و نه زن را غنیمت سفرش. فقط گفت: «بگذار داستانت را بشنوم.» از همین جمله، فصلی آغاز شد که نه قصه فتح کلبه بود و نه قصه تصاحب بانوی آن؛ قصه شناختن بود.","برف آن‌قدر نرم می‌بارید که گویی جنگل می‌خواست رازِ خود را زیر سپیدی پنهان کند. مرد سال‌ها در این جنگل زیسته بود؛ درختان را می‌شناخت، صدای شکستن شاخه‌های خشک را از پای جانوران تمیز می‌داد، اما آن شب از میان کاج‌ها دودی برخاست که هیچ‌گاه پیش از آن ندیده بود.","مرد کلبه نگاهش را از شعله برداشت و گفت از کجا آمده‌ای؟ چه کسی تو را در این کلبه نگه داشته است؟» بانوی آتش: «نامی که روزگاری داشتم، هنوز از یادم نرفته؛ اما هر بار که می‌خواهم از گذشته سخن بگویم، ساعتِ بالای شومینه می‌ایستد. گویی کلبه نیز از یادآوری می‌ترسد.»","زن درِ یخچال را گشود. سیب‌های سرخ، شیر تازه، سبزی و نان گرم آنجا بود. مرد پرسید: «اگر هیچ‌کس غذا نخورد، چه می‌شود؟» زن گفت: «باز هم باید بپزم. این فرمان طلسم است. من در این خانه به فراوانی محکوم شده‌ام و از همین فراوانی، گرسنه آزادی‌ام.»","آن شب، مرد چیزی از سفره نخورد. زن نیز اصرار نکرد. همین خودداری ساده، نخستین شکاف را در دیوار نامرئی طلسم انداخت؛ یا دست‌کم چنین به نظر می‌رسید."],"img":"assets/scene-1.svg","cinematicPage":5,"cinematicCaption":"آشپزخانه افسون‌شده؛ بانوی آتش هنوز در کلبه است"},{"t":"جوانی، اَبَرنواختر و عطر بهارنارنج","p":["صبحِ بعد، مرد از خواب کوتاهی کنار شومینه برخاست. در قاب پنجره هنوز برف می‌بارید، ولی در گلدان کوچک کنار سماور، شاخه‌ای نارنج شکوفه داده بود. زن گفت نمی‌داند این گل از کجا آمده؛ همان‌گونه که نمی‌دانست یخچال کلبه چگونه هر صبح پر می‌شود. مرد شکوفه را بو کشید و گفت: «گاهی آدم در زمستون هم دلش بهار می‌خواد.»","مرد گفت: «تمام روزگارم لحظه‌ای است. من کجا یک روز زیستم؟ من طفلی تازه متولد شده‌ام که آبستن خویشم. کی و کجا از این منیت فارغ می‌شوم، نمی‌دانم؛ اما خوب می‌دانم زیستن را دوست دارم.» بانو شعله را نگریست؛ گویی در آن، کودکی و پیری هم‌زمان می‌رقصیدند.","مرد از جوانی گفت؛ از روزگاری که چون خواب می‌گذرد و از فرصتی که ناگهان دیر می‌شود. اما اصرار داشت که عمر را نباید تنها به شمار روزها سنجید. گاه یک لحظه شناخت، از سالیانِ بی‌تأمل زنده‌تر است. گفت: «سراسر خورشید جوشانم و دلم می‌خواهد اَبَرنواختری کوچک شوم.»","بانو نخست «ابر» را ابرِ باران پنداشت. مرد خندید: «نه، اَبَر به معنای بزرگ؛ اَبَرنواختر، انفجار ستاره. اما حالا که گفتی باران، دلم باران بی‌دغدغه می‌خواهد، لطافت بهاری و بوی عطر بهارنارنج.» زن پنجره را اندکی گشود و سرمایی لطیف با گرمای شومینه آمیخت.","مرد با نوک انگشت بخار روی شیشه را پاک کرد. دوردست، آسمان چنان صاف بود که گویی ستاره‌ها نیز از سرمای جنگل به خود می‌لرزیدند. گفت: «عمر رو گاهی به اشتباه، ردیفِ روزهای پشت سر هم می‌دونیم. اما من هنوز دارم خودم رو به دنیا می‌آرم. حتی اگر موهام سفید بشه، این زایش تموم نمی‌شه.»","بانوی آتش پرسید: «پس دلت برای جوانی تنگ نمی‌شه؟» مرد گفت: «برای فرصت‌هایی که بی‌فکر از دست دادم، چرا. اما نمی‌خوام جوانی رو در قاب نگه دارم. می‌خوام هنوز بتونم از عطر یه شکوفه، شگفت‌زده بشم.»","مرد ادامه داد: «نه از جوانی گریزانم، نه در پی بازگرداندن آن. اگر هر دم آبستن خویشم، هنوز تولد ادامه دارد.» بانو پرسید: «پس کدام روز را می‌خواهی دوباره زندگی کنی؟» مرد پاسخ داد: «تمام روزگارم لحظه‌ای است؛ چرا یک روز را جدا کنم؟»","زن دریافت که در برابرش مردی نشسته که از پایان عمر سخن نمی‌گوید؛ از امکانِ بی‌پایانِ آغاز سخن می‌گوید. بیرون زمستان بود و در خیال مرد، شکوفه‌های بهارنارنج بی‌اجازه می‌روییدند.","مرد کلبه نگاهش را از شعله برداشت و گفت دلم باران بی‌دغدغه می‌خواهد؛ لطافت بهاری و بوی عطر بهارنارنج. نه برای آنکه زمستان را انکار کنم، برای آنکه در زمستان نیز توان رؤیا داشتن را از دست ندهم.»","زن برای نخستین بار دانست که مرد از اَبَرنواختر سخن گفته است، نه از ابری در آسمان. از ستاره‌ای که عظمتش را در انفجار می‌نمایاند و بااین‌همه دلِ مرد، از آن همه شکوه، تنها بارانی آرام طلب می‌کرد.","مرد کلبه لحظه‌ای مکث کرد و ادامه داد من کجا یک روز زیستم؟ تمام روزگارم لحظه‌ای است. من طفلی تازه متولد شده‌ام که آبستن خویشم. کی از منیت فارغ شوم، نمی‌دانم؛ اما زیستن را دوست دارم، و این دوست داشتن را با هیچ نام دیگری معاوضه نمی‌کنم.»","بانو فنجان‌ها را شست. مرد تا دیرهنگام به شکوفه نارنج نگاه می‌کرد؛ نه به امید آنکه بهار را مالک شود، بلکه به شوق آنکه هنوز می‌توانست بویش را دریابد."],"img":"assets/scene-2.svg","cinematicPage":3,"cinematicCaption":"چای و زمستان؛ گفت‌وگوی آغازین"},{"t":"دوست داشتن؛ زبانی مستقل","p":["در آن ساعت، زن کتابی کهنه از قفسه بیرون کشید. روی جلدش واژه «عشق» با خطی درشت نوشته شده بود. مرد نگاهی به کتاب انداخت و گفت: «از عنوانش نترس؛ از این بترس که آدم‌ها گاهی برای تملک، اسم قشنگ انتخاب می‌کنن.» زن کتاب را بست، اما پرسشی در چشم‌هایش باقی ماند.","بانو گفت: «شاید عشق، مقدمه دوست داشتن باشد؛ شورِ ناپخته‌ای که به بلوغ می‌رسد.» مرد بی‌درنگ سر برداشت: «عشق مقدمه دوست داشتن نیست، بانو. عشق الفبای دوست داشتن نیست. دوست داشتن خودش زبانی مستقل و لغت‌نامه‌ای کامل است.»","مرد گفت: «دوست می‌داری که آرام گیری و جهان از آرامشت متبلور می‌شود. اما در آن عاشقیِ زمینی که من نقد می‌کنم، خود را محق می‌دانی؛ دیگری باید تو را درک کند، پا به پایت در جهانی که نمی‌شناسد همراه شود و خواسته‌هایش را به نام عشق قربانی کند.»","«در عشقِ تملک‌جو، عاشق شخصی و در پی وصالی؛ در دوست داشتن، صفات را دوست می‌داری. از لطافت رود، از بخشندگی دریا، از گرمای آتش و از حقیقت زمستان لذت می‌بری، بی‌آنکه بخواهی ماهیتشان را به فرمان خود درآوری.»","زن گفت: «تو با واژه عشق سرِ ستیز داری؟» مرد پاسخ داد: «با واژه نه؛ با این عادتی که به اسم عشق، حقِ انتخاب دیگری رو می‌بلعه. من می‌گم دوست داشتن رو باید از اول، مستقل فهمید. نمی‌شه اول کسی رو در بند کشید و بعد اسمِ باز کردن بندش رو بلوغ گذاشت.»","آنچه میانشان می‌گذشت به هیچ محکمه‌ای شباهت نداشت؛ زن گاهی مخالفت می‌کرد، مرد گاهی سخنش را دقیق‌تر می‌ساخت. در این گفت‌وگو کسی پیِ پیروزی نبود. پرسش‌ها در هوای گرم کلبه می‌چرخیدند و با هر پاسخ، معنای تازه‌ای می‌یافتند.","بانو پرسید: «آیا نمی‌توان عاشق بود و آزاد گذاشت؟» مرد پاسخ داد: «ممکن است کسی نام آن احساس را عشق بگذارد؛ من با واژه‌ها جنگ ندارم، با تقدیسِ اسارت جنگ دارم. آنچه من دوست داشتن می‌نامم، شاخه‌ای از عشق نیست. عشقِ خودخواه، شاخه خشکیده‌ای از درخت تنومند دوست داشتن است که باید هرس شود.»","مرد ادامه داد: «گاه گذاشتن و رفتن، عین دوست داشتنی عمیق است. نه از سر بی‌مهری، بلکه از آن رو که هر دو می‌دانند نزدیکیِ بی‌حد، ماهیت یکی را می‌سوزاند.» بانو به شعله نزدیک شد و فهمید که آتش نیز برای روشن ماندن، به فاصله نیاز دارد.","مرد کلبه نگاهش را از شعله برداشت و گفت در دوست داشتن، تو روی خودت کار می‌کنی که دریا شوی؛ اما در عاشقیِ مالکانه، این دریاست که خروشانی می‌کند و می‌خواهد به رود برسد، و وقتی به رود می‌رسد چیزی از رود باقی نمی‌گذارد؛ همه‌اش دریاست.»","بانوی آتش فنجانش را بر میز نهاد و گفت اگر دوست داشتن زبانی مستقل است، چگونه واژه‌هایش را می‌آموزیم؟» مرد کلبه: «از پذیرفتن حقیقتِ هر چیز. از آنکه بدانی رود باید جاری باشد، شمع می‌سوزاند، زمستان سرد است و آدمی حق دارد خود را از سرما نگاه دارد.»","مرد کلبه لحظه‌ای مکث کرد و ادامه داد در دوست داشتن لذت نگاه کردن هست. دوست داشتن را بیاموز که همه چیز است. عشقِ خودخواه، دوست داشتن را به ابتذال می‌کشاند؛ من با نامِ عشق، آنچه را در عمل اسارت می‌آورد تطهیر نمی‌کنم.»","زن کتاب را دوباره در قفسه گذاشت. این بار، پیش از بستن در، زیر لب گفت: «شاید باید لغت‌نامه تازه‌ای بنویسیم.» مرد گفت: «نه از صفر؛ از دیدن آنچه همیشه جلوی چشم‌مان بوده.»"],"img":"assets/scene-3.svg","cinematicPage":2,"cinematicCaption":"گفت‌وگو کنار شومینه"},{"t":"رود را در قاب زندانی مکن","p":["آفتاب کم‌جان زمستان، خط باریکی بر کف کلبه کشیده بود. مرد کنار پنجره نشست و با انگشت مسیر رودی را نشان داد که از میان درختان می‌گذشت. زن گفت: «این رود آخرش کجا می‌ره؟» مرد بی‌آنکه نگاهش را از آب بردارد، پاسخ داد: «بیا اول ببینیم چرا باید بره.»","مرد از کنار پنجره، رودِ زیر یخ را نشان داد: «رود را می‌نگری که با همه وجود در کوه و دشت جاری می‌شود، سنگ‌های کوچک و بزرگ را نرم و صیقلی می‌کند. تو از جرعه‌ای از آن مست می‌شوی. اما عاشقِ مالک، می‌خواهد تمام رود را در قاب عکسی برای خود نگه دارد.»","«در قاب، زیبایی رود برای تو می‌ماند، اما روح جاری‌اش اسیر می‌شود. رودِ ساکن، دیگر رودِ سرخوش نیست. تو آن را برای داشتنِ منظره‌ای زیبا خاموش کرده‌ای و بعد نام این خاموشی را وصال گذاشته‌ای.»","بانو پرسید: «اگر رود خود خواست بماند چه؟» مرد گفت: «رود لیوانی آب نیست که در دریا بریزد و تمام شود. رود به دریا می‌ریزد و همچنان رود است؛ پیوسته می‌آید، می‌بخشد، تازه می‌شود و فصلی دیگر از زندگی را تجربه می‌کند.»","بانوی آتش گفت: «پس وقتی رود به دریا می‌رسه، هویتش از بین نمی‌ره؟» مرد خندید: «رود که لیوان آب نیست، بانو! یک‌بار نمی‌ریزه که تموم بشه. تا سرچشمه هست و راه هست، جاریه. رسیدنش به دریا، پایانش نیست؛ فصل تازه‌ای از زندگیشه.»","مرد ادامه داد: «دریا هم اگر دریا باشه، رود رو به خاطر خودش نمی‌خواد. با خورشید دوستی می‌کنه، بخار می‌شه، به ابر و بارون راه می‌ده. دریا می‌فهمه که بخشندگی فقط دریافت کردن نیست؛ گاهی باید از خودت بگذری تا چیزی دور از تو جان بگیره.»","«رود رها و آزاد می‌رود؛ می‌رود و می‌رود تا به دریا برسد. تو دریا باش و عاشقی کن، رود خودش با همه وجود به تو می‌پیوندد. وسعت دریا شاید هدیه تلاش رود باشد و تازگی و جوانی رود، پاداش دریا.»","بانو گفت: «اما اگر رودِ مورد نظرت به دریای تو نریخت؟» مرد خندید: «آیا دریا از نریختن یک رود نگران نابودی است؟ دریا که شوی، صدای رود از دوردست هم زیباست. گاه بخار می‌شوی، ابر می‌شوی و باران می‌شوی و بی‌چشمداشت رود را جوان‌تر می‌کنی.»","«اگر دریایی نباشد، این چرخه در تصویر ما کامل نمی‌شود. اگر ابری نباشد، بارانی نیست و اگر بارانی نباشد، رودی نیست. وصال همیشه به معنای در آغوش گرفتن نیست؛ گاه در بارانی است که از دور بر سرچشمه می‌بارد.»","«دریا شو، بانوی آتش. رودخانه خودش می‌آید. وقتی دریا شدی، مکانی برای آرامش و رشد هزاران موجودی؛ دیگر تنها از خودت نیستی، دنیایی از توست و تو از دنیایی.»","مرد کلبه نگاهش را از شعله برداشت و گفت اگر تو دریا شدی و رود مورد نظرت به تو نریخت، چه؟ آیا واقعاً دریا از نریختن یک رود به خودش نگران نابودی است؟ دریا که می‌شوی، صدای رود حتی از دوردست برایت زیباست.»","بانوی آتش فنجانش را بر میز نهاد و گفت پس دریایی که به رود نمی‌رسد، چگونه دوست داشتنش را نشان می‌دهد؟» مرد کلبه: «گاهی بخار می‌شود، ابر می‌شود، باران می‌شود و به رود می‌پیوندد؛ رود را جوان‌تر و قوی‌تر می‌کند، بی‌هیچ چشمداشتی.»","مرد کلبه لحظه‌ای مکث کرد و ادامه داد تو مکانی برای آرامش و رشد و نمو هزاران موجود و گیاه و رودی. تو دیگر خودت نیستی که دنیایی از توست؛ تو از دنیایی. یاد می‌گیری با خورشید و زمین و رود دوستی کنی تا زنده بمانی و زندگی بدهی.»","بانو به رود نگاه کرد. اکنون می‌دانست که دریا در اندیشه مرد، ظرفی برای جمع‌آوری رودها نبود؛ جهانی بود که از بخشندگی جان می‌گرفت، نه از شمار آنچه به تصرف درآورده است.","از پشت شیشه، رود همچنان می‌رفت. هیچ‌کدام نمی‌دانستند دریا چقدر دور است؛ اما دیگر دوری را به معنای بی‌پیوندی نمی‌گرفتند."],"img":"assets/scene-4.svg","cinematicPage":6,"cinematicCaption":"رود و دریا از پنجره کلبه"},{"t":"زمستان پشت پنجره؛ فاصله‌ای به اندازه خرد","p":["هیزم‌ها با صدایی خشک شکستند. باد از پنجره نیمه‌باز به اتاق می‌دوید و شعله را یک‌سو می‌کشاند. زن شالش را دور شانه جمع کرد؛ مرد برخاست و بی‌شتاب دستگیره پنجره را گرفت. گفت: «حالا می‌خوام از خود زمستون برات بگم.»","باد سرد از پنجره به درون پیچید. مرد چند هیزم بر شومینه نهاد و گفت: «در زمستانی، بهارم آرزوست.» سپس پنجره را بست و دست‌هایش را برابر آتش به هم مالید. رو به بانو پرسید: «آیا چون برای رهایی از سوز زمستان پنجره را بستم، زمستان را درنمی‌یابم یا دوست ندارم؟»","«زمستان در پس پنجره زیبا و دوست‌داشتنی است. قبول واقعیت ذاتی هر چیز، پیش از دیوانگی و جنونِ عشق می‌آید. من برای لذت بردن از حضور زمستان، حصاری از گرما میان خود و او می‌کشم. وصالی در کار نیست، اما دوست داشتن عالی است.»","بانو به شیشه مه‌گرفته دست کشید. مرد گفت: «آیا زمستان راضی است مرا بی‌آتش در آغوش بگیرد؟ زمستان ماهیت خود را دارد و من تنِ آسیب‌پذیر خود را. اگر از سر شیدایی خود را به سرمای کشنده بسپارم، نه زمستان مهربان‌تر شده و نه من خردمندتر.»","بانو گفت: «اگر پنجره رو باز بذاریم، سرمای زمستون اتاق رو می‌گیره؛ اگر ببندیم، صداش رو کمتر می‌شنویم.» مرد پاسخ داد: «قرار نیست برای دوست داشتنِ یک چیز، همه فاصله‌ها رو برداریم. پنجره رو می‌بندم و هنوز برف رو می‌بینم. من زمستون رو از پشت همین شیشه هم با تمام وجود دوست دارم.»","در آن لحظه، شیشه‌ای که هم مانع بود و هم امکان به چشم می‌آمد: سرما را بیرون نگاه می‌داشت و زیبایی‌اش را در قاب پنجره به خانه می‌آورد. شاید بعضی مرزها برای بریدنِ پیوند ساخته نشده باشند؛ برای آن ساخته شده باشند که پیوند دوام آورد.","«آب و آتش اگر بی‌ملاحظه به هم نزدیک شوند، یکی را قربانی می‌کنند. کویر و دریا، خورشید و آب‌ها، کوه و دره، گاه با یک گام فاصله زیباتر می‌مانند. دوست داشتن، احترام به همین فاصله است.»","بانو گفت: «پس فاصله، همیشه جدایی نیست.» مرد پاسخ داد: «گاه فاصله، شیوه نگهداریِ پیوند است؛ همان شیشه نازکی که زمستان را زمستان می‌گذارد و ما را زنده.»","مرد کلبه نگاهش را از شعله برداشت و گفت سوز هوا را دوست دارم؛ عطر عشق می‌دهد. زمستان برای من یا من برای زمستان؟ زمستان را عاشقی نتوان کرد با هیزمی در دل آتش. آیا زمستان راضی است تو را بی‌آتش در آغوش بگیرد؟»","بانوی آتش فنجانش را بر میز نهاد و گفت پنجره را بستی، اما هنوز به برف نگاه می‌کنی.» مرد کلبه: «همین است! من زمستان را دوست دارم، نه آنکه بخواهم زمستان را درون رگ‌هایم زندانی کنم. برای تماشای زیبایی‌اش باید زنده بمانم.»","مرد دست‌هایش را نزدیک آتش گرفت. بیرون، دانه‌های برف روی شیشه نشستند؛ درون، شعله‌ها بر دیوار رقصیدند. میان این دو جهان، تنها یک پنجره بود؛ پنجره‌ای که هم مرز بود و هم امکان دیدار.","شیشه میانشان و زمستان باقی ماند. زن دست بر آن گذاشت و برای نخستین بار، به جای حسرتِ آن سوی پنجره، قدرِ گرمای این سویش را دانست."],"img":"assets/scene-5.svg","cinematicPage":1,"cinematicCaption":"زمستان پشت پنجره"},{"t":"محاکمه شمع و پروانه","p":["روی طاقچه شمعی روشن بود. پروانه‌ای کوچک، گاه به روشنایی نزدیک می‌شد و گاه به تاریکی عقب می‌نشست. زن لبخند زد و گفت: «انگار قصه‌های قدیمی دوباره شروع شده.» مرد چشم به بال‌های لرزان دوخت و گفت: «شاید وقتش رسیده پایان اون قصه‌ها رو عوض کنیم.»","شمعی بر طاقچه می‌سوخت و پروانه‌ای به گرد آن می‌گشت. مرد گفت: «شمع می‌سوزد، زیرا ماهیتش این است. پروانه اما اگر برای اثبات عشق خود را در آتش افکند، چرا باید شمع را مقصر بدانیم؟ ماهیت سوزاندن شمع یا بی‌پروایی پروانه؟»","«قرن‌ها سوختن پروانه را نشانه عشق دانسته‌اند. من می‌پرسم چرا باید کسی بمیرد تا ثابت کند نور را دوست دارد؟ پروانه می‌تواند یک گام دورتر بایستد، نور را تماشا کند و فردا دوباره بازگردد. سوختن، الزاماً رهایی از خویش نیست.»","«گاهی انسان با لطمه زدن به خود، دیگری را منفور می‌کند. می‌گوید: برای تو سوختم، پس به من بدهکاری. این فداکاری نیست؛ تبدیلِ رنجِ خودخواسته به ابزار مالکیت و طلبکاری است.»","مرد گفت: «فرض کن پروانه از شمع دور بشه و زنده بمونه. چه چیزی از زیباییِ شمع کم می‌شه؟ هیچ. چه چیزی از دوست داشتن پروانه؟ هیچ. فقط فردا هم فرصت داره نور رو ببینه. چرا ما مرگ رو از زندگی شاعرانه‌تر فرض می‌کنیم؟»","بانوی آتش به بال‌های ظریف حشره نگاه کرد. نه شمع را خاموش کرد و نه پروانه را به سوی شعله راند. تنها پنجره کوچک بالای طاقچه را گشود تا راهی برای پرواز باشد. مرد گفت: «بعضی وقت‌ها دوست داشتن، فقط باز گذاشتنِ راهه.»","بانو گفت: «اما مگر در شعر و عرفان، سوختن نماد رهایی از خودخواهی نیست؟» مرد پاسخ داد: «نماد را می‌فهمم؛ اما وقتی استعاره به دستور زندگی تبدیل شود، می‌تواند جان انسان را بگیرد. من نمی‌خواهم زیبایی شعر، کج‌فهمی رفتار را مقدس کند.»","زن شمع را از مسیر پرواز پروانه دور کرد. نه برای خاموش کردن نور، بلکه برای آنکه تماشا به فاجعه نینجامد. مرد گفت: «دلربا باش و دوست بدار. دوست داشتن را بیاموز که همه چیز است.»","مرد کلبه نگاهش را از شعله برداشت و گفت پروانه رها نمی‌شود از خویشتن در کنار شمع؛ پروانه نمادی از کج‌فهمی انسان‌هاست که با لطمه به خود، دیگری را منفور می‌کنند. شمع چه تقصیری دارد که ماهیتش سوزاندن است؟»","بانوی آتش فنجانش را بر میز نهاد و گفت پس در افسانه ما، پروانه چه می‌کند؟» مرد کلبه: «اگر خردمند باشد، یک گام فاصله می‌گیرد. نه نور را انکار می‌کند و نه جانش را برای اثبات علاقه‌اش از دست می‌دهد.»","مرد نگفت که هیچ‌کس نباید فداکاری کند؛ گفت فداکاری را نباید با نابودیِ بیهوده یکی گرفت. این تفاوت در تمام کلبه پیچید، چنان‌که گویی خود شومینه نیز از بارِ افسانه‌ای که بر دوشش نهاده بودند سبک شد.","پروانه سرانجام بر لبه کتاب نشست. شمع همچنان روشن بود؛ این بار بی‌آنکه قصه برای زیبا شدن، محتاج خاکستر باشد."],"img":"assets/scene-6.svg","cinematicPage":2,"cinematicCaption":"شعله‌ها و گفت‌وگوی شمع و پروانه"},{"t":"آب، هیزم و حرمت مسیر","p":["بانو برای مهمانش آب آورد؛ نه از خوراک افسون‌شده، بلکه از کوزه‌ای که مرد خود از چشمه پر کرده بود. در همان هنگام، هیزمی در شومینه فرو ریخت و جرقه‌ای به هوا پرید. مرد میان لیوان و شعله نگاه گرداند و گفت: «ببین، نه آب مقصر تشنگی ماست، نه چوب مقصر سرمای این جنگل.»","مرد فنجان چای را برداشت: «نوشیدن آب نیاز است و نباید تراژدی باشد. آب برای نوشیده شدن است؛ تمام شدنش در لیوان، مرگِ معنای آن نیست. به بقای دیگری یاری می‌رساند. اما نوشیدنِ بجا، با نابود کردنِ بیهوده یکی نیست.»","هیزمی در شومینه شکست. مرد ادامه داد: «چوب می‌سوزد و گرمایش شاید زندگی کسی را نجات دهد. پس نه هر سوختنی مذموم است و نه هر سوختنی ستودنی. جایگاه، اختیار و اثرِ آن دگرگونی اهمیت دارد.»","«دختری ممکن است آزادانه با انسانی که دوستش دارد زندگی مشترک بسازد، مادر شود، بدنش دگرگون شود و سال‌ها مسئولیت پرورش کودکی را بپذیرد. این انتخاب می‌تواند سرشار از معنا و فداکاری باشد؛ اما مادر شدن نه تکلیف همه زنان است و نه تنها مسیر تعالی آنان.»","بانوی آتش گفت: «پس فداکاری وقتی ارزش داره که آدم خودش انتخابش کرده باشه؟» مرد پاسخ داد: «اختیار شرط مهمیه، اما کافی نیست. باید دید رنج به چه کار می‌آد، چه کسی ازش بهره می‌بره و آیا می‌شد بدون آسیبِ بیهوده هم به همون خیر رسید.»","در این گفت‌وگو دو حقیقت کنار هم قرار می‌گرفت: کودکانی که بی‌گناه و هم‌ارزش به جهان می‌آیند، و مسیرهایی که ممکن است یکی آکنده از رضایت و دیگری آکنده از خشونت باشد. کرامت کودک، هرگز خشونتِ مسیر را توجیه نمی‌کند؛ و رنجِ تحمیل‌شده را نمی‌توان به نام تعالی بر قربانی ستود.","«و دختری دیگر ممکن است قربانی تجاوز پدر خویش شود و از آن خشونت باردار گردد. کودکی که از چنین جنایتی زاده می‌شود، همان اندازه معصوم و سزاوار حرمت است که هر کودک دیگر. اما برابریِ کرامت دو کودک، هرگز به معنای برابریِ اخلاقیِ دو مسیر نیست.»","«در یکی اختیار و رضایت حضور دارد؛ در دیگری حرمت انسان شکسته شده است. هیچ‌کس حق ندارد خشونت را به نام تکامل یا فداکاری توجیه کند. پس ابتدا و انتها را رها مکن، اما بدان که مسیر واژه‌ها نیز بسیار مهم است.»","بانو آهسته گفت: «پس حقیقت را نمی‌توان تنها از نتیجه شناخت.» مرد پاسخ داد: «آری. مسیر، خود بخشی از حقیقت است؛ آنچه به مقصد می‌رسد، بدون آنچه در راه بر انسان گذشته، کامل فهمیده نمی‌شود.»","مرد کلبه نگاهش را از شعله برداشت و گفت ابتدا و انتها را رها نکن، اما مسیر واژه‌ها نیز بسیار مهم است. دو کودک، هر دو معصوم‌اند؛ بااین‌همه نمی‌توان گفت دو مسیری که به تولدشان انجامیده، از حیث اختیار و حرمت انسانی یکسان بوده است.»","بانوی آتش فنجانش را بر میز نهاد و گفت پس دگرگونی، به‌خودی‌خود تعالی نیست؟» مرد کلبه: «نه. باید دید چه کسی انتخاب کرده، چه کسی آسیب دیده و چه چیزی به زندگی افزوده شده است. چوب در جای خود می‌سوزد و گرما می‌دهد؛ جنگل نیز ممکن است بسوزد، اما این دو را نباید با یک ستایش توصیف کرد.»","زن در اندیشه فرورفت. طلسم کلبه نیز نوعی دگرگونی بود: خوراک، مهمان را از رهگذر به زندانی تبدیل می‌کرد. آیا فراوانیِ سفره می‌توانست فقدانِ اختیار را جبران کند؟ پاسخ، در سکوتِ هر دو آشکار بود.","زن به دست‌های خود نگاه کرد؛ دست‌هایی که به فرمان طلسم غذا می‌پختند. اندیشید آیا روزی خواهد رسید که پختن برای او انتخاب باشد، نه اجبار."],"img":"assets/scene-7.svg","cinematicPage":5,"cinematicCaption":"آشپزخانه و معنای اختیار"},{"t":"لیوان آب در قاب؛ طلسمِ انتخاب","p":["شبِ سوم، سکوت کلبه سنگین‌تر شده بود. زن غذایی تازه پخته بود، اما ظرف مرد همچنان خالی ماند. روی دیوار، تصویر لیوانی آب آویخته بود؛ تصویری که از روز نخست در آنجا بود و هیچ‌کس نمی‌دانست چه کسی آن را کشیده است. مرد به قاب نگاه کرد و لبخندی محو بر لبش نشست.","مرد به تصویری از لیوان آب بر دیوار نگاه کرد: «شاید دوست داشتن مانند تصویر لیوانی آب در قاب باشد. با دیدنش سیراب نمی‌شوی، اما ممکن است بالغ‌ترین احساسات زیبای بشری را تجربه کنی. البته اگر تشنه باشی، باید آب واقعی بنوشی؛ دوست داشتن، انکار نیاز نیست.»","«فرق است میان رفع نیاز و میلِ تصاحب. کسی که باغی را دوست دارد، لازم نیست گل‌هایش را بچیند. کسی که رود را دوست دارد، نباید جاری بودنش را از او بگیرد. می‌توان زیبایی را دریافت، بی‌آنکه آن را مصرف یا محبوس کرد.»","بانو به یخچال افسون‌شده نگریست. هنوز پر از نان و میوه بود؛ سفره‌ای که پایان نداشت و آزادی‌ای که پشت آن پنهان می‌شد. پرسید: «اگر روزی غذای مرا بخوری، در این خانه خواهی ماند. آیا این ماندن، دوست داشتن است؟»","زن گفت: «اگه یک روز از اینجا آزاد بشم و راهی دیگه انتخاب کنم، باز هم من رو دوست خواهی داشت؟» مرد بی‌آنکه در پاسخ شتاب کند، به شعله نگاه کرد. سپس گفت: «اگه دوست داشتن رو فقط تا وقتی بخوام که کنار من بمونی، از همون اول اسمِ اشتباهی روش گذاشتم.»","بانو دستش را بر درگاه آشپزخانه گذاشت. برای نخستین بار به این اندیشید که شاید طلسم کلبه با غذایی جادویی آغاز شده، اما تداومش از ترسِ تنها ماندن نیرو گرفته باشد. این هنوز پاسخی قطعی نبود؛ تنها پرسشی تازه بود که می‌توانست سرآغازِ رهایی باشد.","مرد پاسخ داد: «نه اگر بهایش را از من پنهان کنی؛ و نه اگر تنها از ترس تنهایی تو باشد. آنچه به اجبار به دست آید، حتی اگر شکل وصال داشته باشد، روح دوست داشتن را ندارد.»","زن گفت: «پس اگر از طلسم من آگاه شوی و باز هم روزی بمانی؟» مرد گفت: «آن روز باید ببینیم ماندن، انتخاب آزادانه است یا نامی زیبا بر زنجیری که نمی‌بینیم. من نه برای فتح تو آمده‌ام و نه برای آنکه از سوختنم افسانه بسازی.»","پشت پنجره، رود همچنان در زیر یخ‌ها راه می‌رفت. زن دریافت که شاید کلید رهایی‌اش نه در شکستن در، که در شناختنِ تفاوت میان دعوت و اسارت نهفته باشد. مرد برخاست تا هیزم دیگری بر آتش بگذارد؛ و داستان، بی‌آنکه راز خود را یکباره فاش کند، ادامه یافت.","مرد کلبه نگاهش را از شعله برداشت و گفت شاید دوست داشتن مانند تصویر لیوانی آب در قاب عکسی زیباست؛ با نوشیدن تصویر سیراب نمی‌شوی، ولی با دیدنش شاید بالغ‌ترین احساسات زیبای بشری را تجربه کنی. اگر تشنه‌ای، آب واقعی بنوش؛ این بدیهی است و نباید تراژدی باشد.»","بانوی آتش فنجانش را بر میز نهاد و گفت پس اگر روزی بخواهم از این کلبه بیرون بروم و تو در آن بمانی؟» مرد کلبه: «اگر آزاد باشی، رفتنت نیز می‌تواند دوست‌داشتنی باشد. من برای آنکه خودم را صاحب تو بدانم، آزادی‌ات را از تو نمی‌گیرم.»","نیمه‌شب گذشته بود. یخچال جادویی هنوز پر بود. زن در کلبه هنوز اسیر بود. مرد نیز هنوز از غذای او نخورده بود. اما چیزی در سکوت آن خانه تغییر کرده بود: برای نخستین بار، کسی به جای پرسیدنِ راهِ داشتنِ زن، از راهِ آزاد شدنش پرسیده بود.","مرد چراغ را کم‌نور کرد. زن در آستانه آشپزخانه ایستاد و به دری نگاه کرد که هرگز نتوانسته بود از آن بگذرد. پرسش تازه‌ای در دلش جوانه زده بود: اگر کسی مرا دوست بدارد، آیا به من کمک می‌کند از اینجا بروم، حتی اگر دیگر بازنگردم؟"],"img":"assets/scene-8.svg","cinematicPage":3,"cinematicCaption":"سکوت و چای در کلبه"}];let pages=[{type:'cover'},{type:'toc'}];chapters.forEach((c,i)=>{pages.push({type:'chapter',i});c.p.forEach((t,j)=>pages.push({type:'text',i,j}));});let index=+(localStorage.getItem('divan_page')||0),busy=false;function esc(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;')}function render(){const s=document.getElementById('sheet'),p=pages[index];s.className='sheet'+(p.type==='cover'?' cover':'');if(p.type==='cover')s.innerHTML='<div><h2>دیوان دیوانه‌وار</h2><h3>دریا شو، رود خودش می‌آید</h3><p style="text-align:center">در زمستانی، بهارم آرزوست</p><button onclick="go(1)">گشودن کتاب</button></div>';else if(p.type==='toc')s.innerHTML='<h2>فهرست داستان</h2><div class="toc">'+chapters.map((c,i)=>'<button onclick="go('+pages.findIndex(x=>x.type==="chapter"&&x.i===i)+')">'+(i+1)+'. '+esc(c.t)+'</button>').join('')+'</div><p class="note">برای خواندن هر بخش روی نام آن بزنید.</p>';else{const c=chapters[p.i];s.innerHTML=p.type==='chapter'?'<h2>'+esc(c.t)+'</h2><figure class="story-illustration"><img src="'+c.img+'" alt="تصویر داستان: '+esc(c.t)+'"><figcaption>تصویر فصل '+(p.i+1)+' · '+esc(c.t)+'</figcaption></figure><p class="note">بخش '+(p.i+1)+' از '+chapters.length+' · برای ادامه ورق بزنید.</p>':'<h2>'+esc(c.t)+'</h2><p>'+esc(c.p[p.j])+'</p><p class="note">'+(p.j+1)+' / '+c.p.length+'</p>'}document.getElementById('status').textContent='صفحه '+(index+1)+' از '+pages.length;localStorage.setItem('divan_page',index)}function go(n){if(busy||n<0||n>=pages.length)return;busy=true;document.getElementById('sheet').classList.add('turn');setTimeout(()=>{index=n;render();busy=false},240)}function move(n){go(index+n)}function font(n){let x=Math.max(15,Math.min(27,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sz'))+n));document.documentElement.style.setProperty('--sz',x+'px')}let start=0;document.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>70)move(d>0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(1);if(e.key==='ArrowRight')move(-1)});index=Math.max(0,Math.min(index,pages.length-1));render();</script></body></html>
