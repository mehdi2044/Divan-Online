<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دیوان دیوانه‌وار</title><style>body{margin:0;background:radial-gradient(circle at top,#583326,#100e1b 75%);color:#f9e9d3;font-family:Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(96vw,1000px);text-align:center}h1{color:#ffb568}button{background:#a85a27;color:white;border:1px solid #edb66b;border-radius:14px;padding:12px 20px;cursor:pointer;margin:6px}.book{perspective:1600px;min-height:65vh;display:grid;place-items:center}.page{background:#fff1d5;color:#38251e;border-radius:8px 22px 22px 8px;padding:clamp(20px,5vw,55px);width:min(75vw,570px);min-height:55vh;box-shadow:14px 18px 35px #0009,inset -14px 0 25px #a66d3b33;transform-origin:right center;transition:transform .55s;line-height:2.3;text-align:right}.cover{background:linear-gradient(120deg,#3d1b20,#6e3428 55%,#32121a);color:#ffdb9b;border:3px double #e4a64f;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.turn{transform:rotateY(-88deg)}small{opacity:.8}a{color:#ffc17b}</style><main class="wrap"><h1>دیوان دیوانه‌وار</h1><p>دریا شو، رود خودش می‌آید</p><div class="book"><article id="page" class="page cover"></article></div><button onclick="move(-1)">صفحه پیشین</button><button onclick="move(1)">ورق بعد</button><button onclick="toc()">فهرست</button><p id="count"></p><small>نسخه اولیه آنلاین؛ فصل‌های مصور و اجرای صوتی در نسخه تکمیلی افزوده می‌شوند.</small></main><script>const pages=[['جلد','دیوان دیوانه‌وار\n\nدریا شو، رود خودش می‌آید'],['فهرست','۱. دود در جنگل\n۲. راز بانوی آتش\n۳. رود و دریا\n۴. زمستان پشت پنجره\n۵. شمع و پروانه'],['دود در جنگل','زمستان بر شانه‌های جنگل نشسته بود. مرد هیزم‌شکن از دور رشته‌ای دود دید که از سقف کلبه‌ای ناشناس برمی‌خاست. او به سوی نور رفت؛ بی‌آنکه بداند در آن خانه، غذایی هست که خوردنش سرنوشت آدمی را دگرگون می‌کند.'],['راز بانوی آتش','زن گفت: این خانه هیچ مهمانی را گرسنه نمی‌گذارد، اما هرکس از خوراک من بخورد، اسیر افسون کلبه خواهد شد. مرد پاسخ داد: پس نخست حقیقت را بشنویم؛ گرسنگی را می‌توان تاب آورد، اما آزادی را نباید ناآگاهانه فروخت.'],['رود و دریا','مرد گفت: رود را در قاب عکس زندانی مکن. تو دریا باش؛ رود با همه وجودش راه خویش را می‌یابد. دریا حتی از دور به رود می‌بخشد؛ بخار می‌شود، ابر می‌شود و باران می‌شود، بی‌چشمداشت.'],['زمستان پشت پنجره','مرد پنجره را بست و گفت: آیا چون از سوز سرما دوری می‌کنم، زمستان را دوست ندارم؟ دوست داشتن یعنی شناختن ماهیت دیگری و پاس داشتن فاصله‌ای که هر دو را زنده نگه می‌دارد.'],['شمع و پروانه','شمع به اقتضای ماهیت خویش می‌سوزد. چرا باید پروانه برای اثبات شیفتگی در شعله نابود شود؟ دوست داشتن نه تملک است و نه تقدیس رنج؛ شناخت، اختیار و حرمت زندگی است.']];let i=0;function show(){let p=document.getElementById('page');p.className='page'+(i===0?' cover':'');p.innerHTML='<h2>'+pages[i][0]+'</h2><p style="white-space:pre-line">'+pages[i][1]+'</p>';document.getElementById('count').textContent=(i+1)+' / '+pages.length}function move(n){let p=document.getElementById('page');p.classList.add('turn');setTimeout(()=>{i=Math.max(0,Math.min(pages.length-1,i+n));show()},260)}function toc(){i=1;show()}show();</script></html>
