<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دیوان دیوانه‌وار | دریا شو، رود خودش می‌آید</title><meta name="description" content="کتاب آنلاین مصور دیوان دیوانه‌وار؛ گفت‌وگوی مرد کلبه و بانوی آتش"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--sz:19px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#5b302b,#171321 68%);color:#fff1dc;font-family:Vazirmatn,Tahoma,sans-serif}header{padding:15px 20px;text-align:center}header h1{margin:4px;color:#ffc47a;font-size:clamp(24px,4vw,40px)}header p{margin:0;color:#e0c8b5}main{max-width:1100px;margin:auto;padding:8px 14px 35px}.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px}button{background:#67392f;color:#fff0d6;border:1px solid #d29b62;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#9b5539}.book{perspective:1500px;display:flex;justify-content:center;min-height:590px}.sheet{background:#fff5df;color:#38271e;box-shadow:15px 20px 45px #0009,inset -10px 0 24px #a06c3b30;border-radius:9px 23px 23px 9px;width:min(100%,790px);min-height:570px;padding:clamp(18px,4vw,42px);transform-origin:right;transition:transform .42s;overflow:hidden}.sheet.turn{transform:rotateY(-78deg)}.sheet.cover{display:grid;place-items:center;text-align:center;background:linear-gradient(130deg,#3e1b24,#743a31,#271521);color:#ffdba4;border:5px double #d5a15e}.sheet h2{color:#7b402e;font-size:clamp(22px,3vw,31px);margin:12px 0}.sheet.cover h2{color:#ffce86;font-size:clamp(34px,6vw,62px)}.sheet p{font-size:var(--sz);line-height:2.35;text-align:justify}.sheet img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;border-radius:14px;background:#28334a;margin:12px auto 22px}.toc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toc button{text-align:right;background:#f6e2c4;color:#4c3028;border:1px solid #cba47b}.meta{text-align:center;color:#b89e8e;font-size:13px}.foot{text-align:center;margin:16px;color:#d8bb9c}.note{font-size:14px;color:#856c56!important}a{color:#ffcd84}@media(max-width:650px){.toc{grid-template-columns:1fr}.sheet{min-height:65vh}.sheet p{line-height:2.15}.book{min-height:65vh}}</style></head><body><header><h1>دیوان دیوانه‌وار</h1><p>دریا شو، رود خودش می‌آید · روایت مرد کلبه و بانوی آتش</p></header><main><nav class="toolbar"><button onclick="go(0)">جلد</button><button onclick="go(1)">فهرست</button><button onclick="move(-1)">❯ پیشین</button><button onclick="move(1)">بعدی ❮</button><button onclick="font(-1)">الف −</button><button onclick="font(1)">الف +</button></nav><section class="book"><article class="sheet" id="sheet"></article></section><div class="foot"><span id="status"></span><p class="meta">تصاویر مستقل SVG و متن HTML؛ بدون استفاده از صفحات PDF · نسخه دوم</p></div></main><script>const chapters=[{"t":"دود در میان برف؛ زنی در بندِ خانه","p":["زمستان بر شانه‌های جنگل نشسته بود و مردی که سالیان دراز با هیزم و کتاب روزگار می‌گذراند، در راه بازگشت رشته‌ای دود دید. آن سوی درختان، کلبه‌ای بود که دیروز نبود. مرد تبر را بر زمین گذاشت و به پنجره‌های روشن خیره شد. از دود، گرما را حدس زد؛ اما از گرما، صاحب خانه را نه.","زن در را گشود؛ گیسوان روشن، جامه‌ای به رنگ شرابِ انار و نگاهی که هم دعوت بود و هم هشدار. گفت: «در این خانه، آتش خاموش نمی‌شود؛ ولی هر روشنایی، نشانه رهایی نیست.» مرد پاسخ داد: «آتش اگر خانه را گرم کند، نعمت است؛ اگر خانه را زندان کند، چه؟»","زن گفت که سال‌هاست به طلسمی بسته شده است. یخچال کلبه هر بامداد پر می‌شود، بی‌آنکه کسی از بیرون چیزی بیاورد. شرطِ جادو این است که او خود غذا بپزد؛ و هر که از دست‌پختش بخورد، به سرنوشت این خانه گرفتار شود. زن می‌تواند در را بگشاید، اما از آستانه دور نمی‌شود.","مرد گرسنه بود. بوی نان تازه، از آشپزخانه تا درگاه می‌رسید. بااین‌همه دست به سفره نبرد. گفت: «اگر لقمه‌ای قرار است آزادی مرا بگیرد، باید پیش از خوردن، بهایش را بدانم. نیاز، حقیقت دارد؛ اما فریب را نباید با مهمان‌نوازی آراست.» زن برای نخستین بار لبخندی بی‌هراس زد.","آن شب مرد هیزمی بر آتش نهاد و کنار شومینه نشست. نه خود را ناجی زن خواند و نه زن را غنیمت سفرش. فقط گفت: «بگذار داستانت را بشنوم.» از همین جمله، فصلی آغاز شد که نه قصه فتح کلبه بود و نه قصه تصاحب بانوی آن؛ قصه شناختن بود."],"img":"assets/scene-1.svg"},{"t":"جوانی، اَبَرنواختر و عطر بهارنارنج","p":["مرد گفت: «تمام روزگارم لحظه‌ای است. من کجا یک روز زیستم؟ من طفلی تازه متولد شده‌ام که آبستن خویشم. کی و کجا از این منیت فارغ می‌شوم، نمی‌دانم؛ اما خوب می‌دانم زیستن را دوست دارم.» بانو شعله را نگریست؛ گویی در آن، کودکی و پیری هم‌زمان می‌رقصیدند.","مرد از جوانی گفت؛ از روزگاری که چون خواب می‌گذرد و از فرصتی که ناگهان دیر می‌شود. اما اصرار داشت که عمر را نباید تنها به شمار روزها سنجید. گاه یک لحظه شناخت، از سالیانِ بی‌تأمل زنده‌تر است. گفت: «سراسر خورشید جوشانم و دلم می‌خواهد اَبَرنواختری کوچک شوم.»","بانو نخست «ابر» را ابرِ باران پنداشت. مرد خندید: «نه، اَبَر به معنای بزرگ؛ اَبَرنواختر، انفجار ستاره. اما حالا که گفتی باران، دلم باران بی‌دغدغه می‌خواهد، لطافت بهاری و بوی عطر بهارنارنج.» زن پنجره را اندکی گشود و سرمایی لطیف با گرمای شومینه آمیخت.","مرد ادامه داد: «نه از جوانی گریزانم، نه در پی بازگرداندن آن. اگر هر دم آبستن خویشم، هنوز تولد ادامه دارد.» بانو پرسید: «پس کدام روز را می‌خواهی دوباره زندگی کنی؟» مرد پاسخ داد: «تمام روزگارم لحظه‌ای است؛ چرا یک روز را جدا کنم؟»","زن دریافت که در برابرش مردی نشسته که از پایان عمر سخن نمی‌گوید؛ از امکانِ بی‌پایانِ آغاز سخن می‌گوید. بیرون زمستان بود و در خیال مرد، شکوفه‌های بهارنارنج بی‌اجازه می‌روییدند."],"img":"assets/scene-2.svg"},{"t":"دوست داشتن؛ زبانی مستقل","p":["بانو گفت: «شاید عشق، مقدمه دوست داشتن باشد؛ شورِ ناپخته‌ای که به بلوغ می‌رسد.» مرد بی‌درنگ سر برداشت: «عشق مقدمه دوست داشتن نیست، بانو. عشق الفبای دوست داشتن نیست. دوست داشتن خودش زبانی مستقل و لغت‌نامه‌ای کامل است.»","مرد گفت: «دوست می‌داری که آرام گیری و جهان از آرامشت متبلور می‌شود. اما در آن عاشقیِ زمینی که من نقد می‌کنم، خود را محق می‌دانی؛ دیگری باید تو را درک کند، پا به پایت در جهانی که نمی‌شناسد همراه شود و خواسته‌هایش را به نام عشق قربانی کند.»","«در عشقِ تملک‌جو، عاشق شخصی و در پی وصالی؛ در دوست داشتن، صفات را دوست می‌داری. از لطافت رود، از بخشندگی دریا، از گرمای آتش و از حقیقت زمستان لذت می‌بری، بی‌آنکه بخواهی ماهیتشان را به فرمان خود درآوری.»","بانو پرسید: «آیا نمی‌توان عاشق بود و آزاد گذاشت؟» مرد پاسخ داد: «ممکن است کسی نام آن احساس را عشق بگذارد؛ من با واژه‌ها جنگ ندارم، با تقدیسِ اسارت جنگ دارم. آنچه من دوست داشتن می‌نامم، شاخه‌ای از عشق نیست. عشقِ خودخواه، شاخه خشکیده‌ای از درخت تنومند دوست داشتن است که باید هرس شود.»","مرد ادامه داد: «گاه گذاشتن و رفتن، عین دوست داشتنی عمیق است. نه از سر بی‌مهری، بلکه از آن رو که هر دو می‌دانند نزدیکیِ بی‌حد، ماهیت یکی را می‌سوزاند.» بانو به شعله نزدیک شد و فهمید که آتش نیز برای روشن ماندن، به فاصله نیاز دارد."],"img":"assets/scene-3.svg"},{"t":"رود را در قاب زندانی مکن","p":["مرد از کنار پنجره، رودِ زیر یخ را نشان داد: «رود را می‌نگری که با همه وجود در کوه و دشت جاری می‌شود، سنگ‌های کوچک و بزرگ را نرم و صیقلی می‌کند. تو از جرعه‌ای از آن مست می‌شوی. اما عاشقِ مالک، می‌خواهد تمام رود را در قاب عکسی برای خود نگه دارد.»","«در قاب، زیبایی رود برای تو می‌ماند، اما روح جاری‌اش اسیر می‌شود. رودِ ساکن، دیگر رودِ سرخوش نیست. تو آن را برای داشتنِ منظره‌ای زیبا خاموش کرده‌ای و بعد نام این خاموشی را وصال گذاشته‌ای.»","بانو پرسید: «اگر رود خود خواست بماند چه؟» مرد گفت: «رود لیوانی آب نیست که در دریا بریزد و تمام شود. رود به دریا می‌ریزد و همچنان رود است؛ پیوسته می‌آید، می‌بخشد، تازه می‌شود و فصلی دیگر از زندگی را تجربه می‌کند.»","«رود رها و آزاد می‌رود؛ می‌رود و می‌رود تا به دریا برسد. تو دریا باش و عاشقی کن، رود خودش با همه وجود به تو می‌پیوندد. وسعت دریا شاید هدیه تلاش رود باشد و تازگی و جوانی رود، پاداش دریا.»","بانو گفت: «اما اگر رودِ مورد نظرت به دریای تو نریخت؟» مرد خندید: «آیا دریا از نریختن یک رود نگران نابودی است؟ دریا که شوی، صدای رود از دوردست هم زیباست. گاه بخار می‌شوی، ابر می‌شوی و باران می‌شوی و بی‌چشمداشت رود را جوان‌تر می‌کنی.»","«اگر دریایی نباشد، این چرخه در تصویر ما کامل نمی‌شود. اگر ابری نباشد، بارانی نیست و اگر بارانی نباشد، رودی نیست. وصال همیشه به معنای در آغوش گرفتن نیست؛ گاه در بارانی است که از دور بر سرچشمه می‌بارد.»","«دریا شو، بانوی آتش. رودخانه خودش می‌آید. وقتی دریا شدی، مکانی برای آرامش و رشد هزاران موجودی؛ دیگر تنها از خودت نیستی، دنیایی از توست و تو از دنیایی.»"],"img":"assets/scene-4.svg"},{"t":"زمستان پشت پنجره؛ فاصله‌ای به اندازه خرد","p":["باد سرد از پنجره به درون پیچید. مرد چند هیزم بر شومینه نهاد و گفت: «در زمستانی، بهارم آرزوست.» سپس پنجره را بست و دست‌هایش را برابر آتش به هم مالید. رو به بانو پرسید: «آیا چون برای رهایی از سوز زمستان پنجره را بستم، زمستان را درنمی‌یابم یا دوست ندارم؟»","«زمستان در پس پنجره زیبا و دوست‌داشتنی است. قبول واقعیت ذاتی هر چیز، پیش از دیوانگی و جنونِ عشق می‌آید. من برای لذت بردن از حضور زمستان، حصاری از گرما میان خود و او می‌کشم. وصالی در کار نیست، اما دوست داشتن عالی است.»","بانو به شیشه مه‌گرفته دست کشید. مرد گفت: «آیا زمستان راضی است مرا بی‌آتش در آغوش بگیرد؟ زمستان ماهیت خود را دارد و من تنِ آسیب‌پذیر خود را. اگر از سر شیدایی خود را به سرمای کشنده بسپارم، نه زمستان مهربان‌تر شده و نه من خردمندتر.»","«آب و آتش اگر بی‌ملاحظه به هم نزدیک شوند، یکی را قربانی می‌کنند. کویر و دریا، خورشید و آب‌ها، کوه و دره، گاه با یک گام فاصله زیباتر می‌مانند. دوست داشتن، احترام به همین فاصله است.»","بانو گفت: «پس فاصله، همیشه جدایی نیست.» مرد پاسخ داد: «گاه فاصله، شیوه نگهداریِ پیوند است؛ همان شیشه نازکی که زمستان را زمستان می‌گذارد و ما را زنده.»"],"img":"assets/scene-5.svg"},{"t":"محاکمه شمع و پروانه","p":["شمعی بر طاقچه می‌سوخت و پروانه‌ای به گرد آن می‌گشت. مرد گفت: «شمع می‌سوزد، زیرا ماهیتش این است. پروانه اما اگر برای اثبات عشق خود را در آتش افکند، چرا باید شمع را مقصر بدانیم؟ ماهیت سوزاندن شمع یا بی‌پروایی پروانه؟»","«قرن‌ها سوختن پروانه را نشانه عشق دانسته‌اند. من می‌پرسم چرا باید کسی بمیرد تا ثابت کند نور را دوست دارد؟ پروانه می‌تواند یک گام دورتر بایستد، نور را تماشا کند و فردا دوباره بازگردد. سوختن، الزاماً رهایی از خویش نیست.»","«گاهی انسان با لطمه زدن به خود، دیگری را منفور می‌کند. می‌گوید: برای تو سوختم، پس به من بدهکاری. این فداکاری نیست؛ تبدیلِ رنجِ خودخواسته به ابزار مالکیت و طلبکاری است.»","بانو گفت: «اما مگر در شعر و عرفان، سوختن نماد رهایی از خودخواهی نیست؟» مرد پاسخ داد: «نماد را می‌فهمم؛ اما وقتی استعاره به دستور زندگی تبدیل شود، می‌تواند جان انسان را بگیرد. من نمی‌خواهم زیبایی شعر، کج‌فهمی رفتار را مقدس کند.»","زن شمع را از مسیر پرواز پروانه دور کرد. نه برای خاموش کردن نور، بلکه برای آنکه تماشا به فاجعه نینجامد. مرد گفت: «دلربا باش و دوست بدار. دوست داشتن را بیاموز که همه چیز است.»"],"img":"assets/scene-6.svg"},{"t":"آب، هیزم و حرمت مسیر","p":["مرد فنجان چای را برداشت: «نوشیدن آب نیاز است و نباید تراژدی باشد. آب برای نوشیده شدن است؛ تمام شدنش در لیوان، مرگِ معنای آن نیست. به بقای دیگری یاری می‌رساند. اما نوشیدنِ بجا، با نابود کردنِ بیهوده یکی نیست.»","هیزمی در شومینه شکست. مرد ادامه داد: «چوب می‌سوزد و گرمایش شاید زندگی کسی را نجات دهد. پس نه هر سوختنی مذموم است و نه هر سوختنی ستودنی. جایگاه، اختیار و اثرِ آن دگرگونی اهمیت دارد.»","«دختری ممکن است آزادانه با انسانی که دوستش دارد زندگی مشترک بسازد، مادر شود، بدنش دگرگون شود و سال‌ها مسئولیت پرورش کودکی را بپذیرد. این انتخاب می‌تواند سرشار از معنا و فداکاری باشد؛ اما مادر شدن نه تکلیف همه زنان است و نه تنها مسیر تعالی آنان.»","«و دختری دیگر ممکن است قربانی تجاوز پدر خویش شود و از آن خشونت باردار گردد. کودکی که از چنین جنایتی زاده می‌شود، همان اندازه معصوم و سزاوار حرمت است که هر کودک دیگر. اما برابریِ کرامت دو کودک، هرگز به معنای برابریِ اخلاقیِ دو مسیر نیست.»","«در یکی اختیار و رضایت حضور دارد؛ در دیگری حرمت انسان شکسته شده است. هیچ‌کس حق ندارد خشونت را به نام تکامل یا فداکاری توجیه کند. پس ابتدا و انتها را رها مکن، اما بدان که مسیر واژه‌ها نیز بسیار مهم است.»","بانو آهسته گفت: «پس حقیقت را نمی‌توان تنها از نتیجه شناخت.» مرد پاسخ داد: «آری. مسیر، خود بخشی از حقیقت است؛ آنچه به مقصد می‌رسد، بدون آنچه در راه بر انسان گذشته، کامل فهمیده نمی‌شود.»"],"img":"assets/scene-7.svg"},{"t":"لیوان آب در قاب؛ طلسمِ انتخاب","p":["مرد به تصویری از لیوان آب بر دیوار نگاه کرد: «شاید دوست داشتن مانند تصویر لیوانی آب در قاب باشد. با دیدنش سیراب نمی‌شوی، اما ممکن است بالغ‌ترین احساسات زیبای بشری را تجربه کنی. البته اگر تشنه باشی، باید آب واقعی بنوشی؛ دوست داشتن، انکار نیاز نیست.»","«فرق است میان رفع نیاز و میلِ تصاحب. کسی که باغی را دوست دارد، لازم نیست گل‌هایش را بچیند. کسی که رود را دوست دارد، نباید جاری بودنش را از او بگیرد. می‌توان زیبایی را دریافت، بی‌آنکه آن را مصرف یا محبوس کرد.»","بانو به یخچال افسون‌شده نگریست. هنوز پر از نان و میوه بود؛ سفره‌ای که پایان نداشت و آزادی‌ای که پشت آن پنهان می‌شد. پرسید: «اگر روزی غذای مرا بخوری، در این خانه خواهی ماند. آیا این ماندن، دوست داشتن است؟»","مرد پاسخ داد: «نه اگر بهایش را از من پنهان کنی؛ و نه اگر تنها از ترس تنهایی تو باشد. آنچه به اجبار به دست آید، حتی اگر شکل وصال داشته باشد، روح دوست داشتن را ندارد.»","زن گفت: «پس اگر از طلسم من آگاه شوی و باز هم روزی بمانی؟» مرد گفت: «آن روز باید ببینیم ماندن، انتخاب آزادانه است یا نامی زیبا بر زنجیری که نمی‌بینیم. من نه برای فتح تو آمده‌ام و نه برای آنکه از سوختنم افسانه بسازی.»","پشت پنجره، رود همچنان در زیر یخ‌ها راه می‌رفت. زن دریافت که شاید کلید رهایی‌اش نه در شکستن در، که در شناختنِ تفاوت میان دعوت و اسارت نهفته باشد. مرد برخاست تا هیزم دیگری بر آتش بگذارد؛ و داستان، بی‌آنکه راز خود را یکباره فاش کند، ادامه یافت."],"img":"assets/scene-8.svg"}];let pages=[{type:'cover'},{type:'toc'}];chapters.forEach((c,i)=>{pages.push({type:'chapter',i});c.p.forEach((t,j)=>pages.push({type:'text',i,j}));});let index=+(localStorage.getItem('divan_page')||0),busy=false;function esc(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;')}function render(){const s=document.getElementById('sheet'),p=pages[index];s.className='sheet'+(p.type==='cover'?' cover':'');if(p.type==='cover')s.innerHTML='<div><h2>دیوان دیوانه‌وار</h2><h3>دریا شو، رود خودش می‌آید</h3><p style="text-align:center">در زمستانی، بهارم آرزوست</p><button onclick="go(1)">گشودن کتاب</button></div>';else if(p.type==='toc')s.innerHTML='<h2>فهرست داستان</h2><div class="toc">'+chapters.map((c,i)=>'<button onclick="go('+pages.findIndex(x=>x.type==="chapter"&&x.i===i)+')">'+(i+1)+'. '+esc(c.t)+'</button>').join('')+'</div><p class="note">برای خواندن هر بخش روی نام آن بزنید.</p>';else{const c=chapters[p.i];s.innerHTML=p.type==='chapter'?'<h2>'+esc(c.t)+'</h2><img src="'+c.img+'" alt="تصویر داستان: '+esc(c.t)+'"><p class="note">بخش '+(p.i+1)+' از '+chapters.length+' · برای ادامه ورق بزنید.</p>':'<h2>'+esc(c.t)+'</h2><p>'+esc(c.p[p.j])+'</p><p class="note">'+(p.j+1)+' / '+c.p.length+'</p>'}document.getElementById('status').textContent='صفحه '+(index+1)+' از '+pages.length;localStorage.setItem('divan_page',index)}function go(n){if(busy||n<0||n>=pages.length)return;busy=true;document.getElementById('sheet').classList.add('turn');setTimeout(()=>{index=n;render();busy=false},240)}function move(n){go(index+n)}function font(n){let x=Math.max(15,Math.min(27,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sz'))+n));document.documentElement.style.setProperty('--sz',x+'px')}let start=0;document.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>70)move(d>0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(1);if(e.key==='ArrowRight')move(-1)});index=Math.max(0,Math.min(index,pages.length-1));render();</script></body></html>
