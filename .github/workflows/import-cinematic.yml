name: Import cinematic images into book
on:
  push:
    paths:
      - '.github/workflows/import-cinematic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download images from Canva exported previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:-1932139241/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAAJ9TuYE8w5i-UF8oVfG2KcUAZBIOso-ldPFyx-thz0H4&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261123%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261123T071725Z%26X-Amz-Expires%3D51918%26X-Amz-Signature%3De149c6527d41e3b81823d1c400372109e683d0e6ea3a9af118472b1a96cdc0d3%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252021%253A42%253A43%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAIoG7a27vqgJ6IJ2WpolVOuTpOOJL2rlWtTK4sATe_BV&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/01-winter-window.png
      test "$(file --mime-type -b assets/images/01-winter-window.png)" = "image/png" || test "$(file --mime-type -b assets/images/01-winter-window.png)" = "image/jpeg"
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:979154372/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAAGww7__6EGTG147n-zDfdL4t6y4TdTEaHIAUOM2imVjh&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0002.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261123%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261123T085609Z%26X-Amz-Expires%3D47037%26X-Amz-Signature%3Df1d298caf36e83222e3b65aecb9991a71caa1d4ac53ef5fc44602f462c5f7ec8%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252022%253A00%253A06%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJaZ9VE46gi7olVqLWiX68UKHYtfD_5zAQRRloamDhfU&page=2&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/02-fireplace-dialogue.png
      test "$(file --mime-type -b assets/images/02-fireplace-dialogue.png)" = "image/png" || test "$(file --mime-type -b assets/images/02-fireplace-dialogue.png)" = "image/jpeg"
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:509852733/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAAB78uY7Y1jWNqP_XjPywQs1mSNmVC3ao6g4PdDvUIE5A&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0003.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261122%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261122T232032Z%26X-Amz-Expires%3D81047%26X-Amz-Signature%3Dd70c7bba699261de0916a866f4bbb420eddda173f4824ecd3b8171bbd77f53b2%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252021%253A51%253A19%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAAAG9OST0rjCn-1TH9whaRM3em4D3aqjMZICpq6H6jnE&page=3&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/03-tea-winter.png
      test "$(file --mime-type -b assets/images/03-tea-winter.png)" = "image/png" || test "$(file --mime-type -b assets/images/03-tea-winter.png)" = "image/jpeg"
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:-175788153/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAAD5K6vaJJDzIFFLWqqPyFEF7muSkKhWvEP2s2N0hD5MW&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0004.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261123%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261123T154941Z%26X-Amz-Expires%3D21356%26X-Amz-Signature%3Dae23200909a8e90c46a067839295e980230bc413a096d557e20bc81bd2f3408a%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252021%253A45%253A37%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKS4GpJezmIBamOUWAn4YQox63LG6mip-vw8pxrXcEly&page=4&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/04-snow-cabin.png
      test "$(file --mime-type -b assets/images/04-snow-cabin.png)" = "image/png" || test "$(file --mime-type -b assets/images/04-snow-cabin.png)" = "image/jpeg"
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:305010510/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAABBsA1phfDgypD__4y2S1g9s-vrQ8TmnbG6HOoj1P92C&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0005.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261123%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261123T012034Z%26X-Amz-Expires%3D72929%26X-Amz-Signature%3Dddde837279b67669e6ea3c90ca23fb6c71831cc0a297289b45c2ee798a2d63fb%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252021%253A36%253A03%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAFFAG2holoxngo1Dno1PqwqpkTULYJLphjIzPvvihF_P&page=5&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/05-enchanted-kitchen.png
      test "$(file --mime-type -b assets/images/05-enchanted-kitchen.png)" = "image/png" || test "$(file --mime-type -b assets/images/05-enchanted-kitchen.png)" = "image/jpeg"
      curl -fLsS --retry 3 'https://media.canva.com/v2/document-image/hash:1315920455/height:335/id:DAHbxFHZ2c4/type:B/width:596?brand=BAGeXPd1pF4&csig=AAAAAAAAAAAAAAAAAAAAAByOjr_D_0eRlyA0ijCfM_UuCBW-WI6WSbElQXUSZ_5v&disableexport=T&exp=1795469822&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FHZ2c4%2FDAHbxFHZ2c4%2F7%2Fthumbnail%2F0006.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH3WCXKVGU%252F20261123%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261123T202859Z%26X-Amz-Expires%3D5181%26X-Amz-Signature%3D27753ec791571e651f4be4de6a5623c40ab033dfcd67970c2883d5b63f90a595%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252023%2520Nov%25202026%252021%253A55%253A20%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAAk4fZN7fQDIabuSIRPpyTklqd2igl8sqvz2xtOHG7u-&page=6&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=7' -o assets/images/06-river-sea.png
      test "$(file --mime-type -b assets/images/06-river-sea.png)" = "image/png" || test "$(file --mime-type -b assets/images/06-river-sea.png)" = "image/jpeg"
      - name: Commit permanent image copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          git diff --cached --quiet || (git commit -m 'Add permanent cinematic chapter images' && git push)
